name: matmul
description: |
  Single-precision matrix multiply C = A @ B. All matrices are row-major and contiguous.
  A is M x K, B is K x N, C is M x N. M, N and K can be any positive integer
  (not necessarily multiples of your tile size). Accumulate in fp32.
signature: |
  extern "C" void launch(const float* A, const float* B, float* C, int M, int N, int K, cudaStream_t stream)

args:
  - {name: A, kind: input, dtype: float32, shape: [M, K]}
  - {name: B, kind: input, dtype: float32, shape: [K, N]}
  - {name: C, kind: output, dtype: float32, shape: [M, N]}
  - {name: M, kind: dim}
  - {name: N, kind: dim}
  - {name: K, kind: dim}

# Error is measured against (|A| @ |B|), so the tolerance tracks the magnitude of the
# terms being summed rather than the (possibly cancelled) result.
tolerance: {rtol: 1.0e-4, atol: 1.0e-5}

shapes:
  visible:
    - {M: 64, N: 64, K: 64}
    - {M: 256, N: 512, K: 128}
    - {M: 1024, N: 1024, K: 1024}
  hidden:
    - {M: 1, N: 1, K: 1}
    - {M: 1023, N: 517, K: 333}
    - {M: 37, N: 2049, K: 65}
    - {M: 2048, N: 3, K: 1500}
    - {M: 129, N: 127, K: 4097}
  benchmark: {M: 2048, N: 2048, K: 2048}

input_distributions: [uniform, small_int, wide_range]
